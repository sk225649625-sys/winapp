name: Build ReelForge Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ReelForge.sln -p:Platform=x64

      - name: Build
        run: dotnet build ReelForge.sln -c Release -p:Platform=x64 --no-restore

      - name: Publish self-contained EXE
        run: dotnet publish ReelForge/ReelForge.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o publish --no-restore

      - name: Prepare package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item publish/* package/ -Recurse -Force
          if (Test-Path "ReelForge/wwwroot") {
            New-Item -ItemType Directory -Force -Path package/wwwroot | Out-Null
            Copy-Item ReelForge/wwwroot/* package/wwwroot/ -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path package/data/media | Out-Null
          New-Item -ItemType Directory -Force -Path package/data/projects | Out-Null
          New-Item -ItemType Directory -Force -Path package/data/exports | Out-Null
          New-Item -ItemType Directory -Force -Path package/data/cache | Out-Null
          New-Item -ItemType Directory -Force -Path package/data/webview2 | Out-Null
          Copy-Item README.md package/README.md -Force
          Compress-Archive -Path package/* -DestinationPath ReelForge-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelForge-windows-x64
          path: ReelForge-windows-x64.zip
          if-no-files-found: error

      - name: Release tagged build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ReelForge-windows-x64.zip
