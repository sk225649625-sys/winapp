name: build-native-cpp

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build pure C++ x64
        run: msbuild ReelForgeNative.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\data\projects,package\data\cache,package\data\exports | Out-Null
          Copy-Item ReelForgeNative\bin\Release\x64\ReelForgeNative.exe package\ -Force
          Compress-Archive -Path package\* -DestinationPath ReelForge-Full-CPlusPlus-Windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelForge-Full-CPlusPlus-Windows-x64
          path: ReelForge-Full-CPlusPlus-Windows-x64.zip

      - name: Release tagged build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ReelForge-Full-CPlusPlus-Windows-x64.zip
