name: Build ReelForge.exe

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ReelForge.sln

      - name: Build
        run: dotnet build ReelForge.sln -c Release --no-restore

      - name: Publish
        run: dotnet publish ReelForge/ReelForge.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item publish/* package/ -Recurse -Force
          if (Test-Path "ReelForge/wwwroot") {
            New-Item -ItemType Directory -Force -Path package/wwwroot | Out-Null
            Copy-Item ReelForge/wwwroot/* package/wwwroot/ -Recurse -Force
          }
          Compress-Archive -Path package/* -DestinationPath ReelForge-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelForge-windows
          path: ReelForge-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ReelForge-windows.zip
